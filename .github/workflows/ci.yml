name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check src scripts tests templates .claude/hooks
      - name: Test
        run: uv run pytest -q
